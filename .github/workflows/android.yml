# be docs 안드로이드 앱 빌드 + 에뮬레이터 전수 테스트.
# APK는 실행 결과 화면의 Artifacts > be-docs-apk 에서 받는다.
# push마다 빌드(약 1분)만 돈다. 에뮬레이터 기기 시험(3대, 한 번에 약 100분)은 Actions 무료 시간을 빨리 써서
# (2026-10: 하루에 약 1,000분) 수동으로만 돌린다: Actions > android > Run workflow.
# 시간을 아끼려면 Run workflow에서 기기를 한 대만 고른다(한 대 약 30분). 실패한 것만 다시 볼 때는 tests·matrix-only로 일부만.
name: android

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      devices:
        description: '기기 시험할 기기(한 대만 고르면 약 30분)'
        type: choice
        default: all
        options:
          - all
          - phone-android13
          - phone-android14
          - fold-android15
      tests:
        description: '일부 시험만(클래스#메서드, 쉼표로 여럿. 비우면 전부). 예: com.squeecho.docviewer.DeviceMatrixTest#versionMatrix'
        type: string
        default: ''
      matrix-only:
        description: '버전별 시험(versionMatrix)에서 파일 이름에 이 낱말이 든 것만(쉼표로 여럿. 비우면 전부)'
        type: string
        default: ''

permissions:
  contents: read

# 같은 브랜치의 새 push가 수동으로 돌린 기기 시험을 취소하지 않게 실행 종류별로 묶는다.
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v5

      - name: Fetch viewer libraries
        run: ./scripts/fetch-vendor.sh

      # 긴 docx 빠른 읽기(엔진과 따로 둔 두 번째 해석기) 단위 시험. 브라우저 없이 1초 안에 끝난다.
      - name: Word fast reader unit tests
        run: node tools/web-test/docx-read-test.mjs

      # 배포 키가 등록됐는지만 다음 단계들에 알린다(키 자체는 빌드 단계에만 넘긴다: npm 설치 등 다른 단계에서 읽히지 않게).
      - name: Check release key
        env:
          KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "HAS_RELEASE_KEY=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_ENV"

      # APK(팀원 직접 설치·갤럭시 스토어)와 플레이용 앱 번들(AAB)을 함께 만든다.
      # 배포 키가 있으면 그 키로, 없으면 디버그 키로 서명한다(디버그 서명 번들은 만들어지는지 확인만 하고 버린다).
      - name: Build APK and bundle
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # 키 파일은 실행 중 임시 폴더에만 풀고, 빌드가 실패해도 지운다.
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          if [ "$HAS_RELEASE_KEY" = true ]; then
            export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_FILE"
          fi
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p build/apk build/aab
          cp app/build/outputs/apk/release/app-release.apk build/apk/be-docs-${GITHUB_SHA::7}.apk
          cp app/build/outputs/bundle/release/app-release.aab build/aab/be-docs-${GITHUB_SHA::7}.aab
          jarsigner -verify build/aab/*.aab | tail -1
          # 서명 인증서 지문(공개해도 되는 값): 배포 키를 만들 때 나온 지문과 같은지 로그에서 확인한다
          keytool -printcert -jarfile build/aab/*.aab | grep 'SHA256:'
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs build/apk/*.apk | grep 'SHA-256 digest'

      - uses: actions/upload-artifact@v6
        with:
          name: be-docs-apk
          path: build/apk/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: env.HAS_RELEASE_KEY == 'true'
        with:
          name: be-docs-aab
          path: build/aab/*.aab
          if-no-files-found: error

  device-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # 안드로이드 13: 아직 업데이트하지 않은 갤럭시가 많은 판. 기본 웹뷰도 더 오래됐다.
      # Run workflow에서 고른 기기만 돌린다(all이면 세 대 모두: 안드로이드 13·14 휴대폰, 안드로이드 15 폴더블).
      matrix: ${{ fromJSON(inputs.devices == 'phone-android13' && '{"include":[{"name":"phone-android13","api-level":33,"profile":"pixel_6"}]}' || inputs.devices == 'phone-android14' && '{"include":[{"name":"phone-android14","api-level":34,"profile":"pixel_6"}]}' || inputs.devices == 'fold-android15' && '{"include":[{"name":"fold-android15","api-level":35,"profile":"7.6in Foldable"}]}' || '{"include":[{"name":"phone-android13","api-level":33,"profile":"pixel_6"},{"name":"phone-android14","api-level":34,"profile":"pixel_6"},{"name":"fold-android15","api-level":35,"profile":"7.6in Foldable"}]}') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v5

      - name: Fetch viewer libraries
        run: ./scripts/fetch-vendor.sh

      # 실행 서버 디스크가 모자라면 에뮬레이터가 데이터 영역을 못 만들고 부팅 대기만 하다 끝난다
      # ("Not enough space to create userdata partition"). 쓰지 않는 도구를 지워 자리를 만든다.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: List emulator device profiles
        continue-on-error: true
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list device -c | tr '\\n' ' '"

      - name: Instrumented tests on emulator (${{ matrix.name }})
        uses: reactivecircus/android-emulator-runner@v2
        # 고른 시험 이름은 스크립트 글에 끼워 넣지 않고 환경 변수로 넘긴다
        env:
          TESTS: ${{ inputs.tests }}
          MATRIX_ONLY: ${{ inputs.matrix-only }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          script: ./scripts/ci-emulator-test.sh

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emulator-${{ matrix.name }}
          path: build/ci-output
          if-no-files-found: ignore
